name: Design package

# Lint, test, build and pack @kairos-io/design, then install the packed
# tarball in the React example to prove the package works outside this
# repository. Nothing here needs a secret, so it runs on forks as it is.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/design/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated files are in step with tokens.json and the assets
        run: npm run check:tokens
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
      - name: Package tarball for the consumer job
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: packages/design/storybook-static
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: packages/design/kairos-io-design-*.tgz
          retention-days: 14

  consume:
    name: Consume the packed package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: package
      - name: Install the tarball in the React example and build it
        working-directory: packages/design/examples/react-vite
        run: |
          npm install --no-audit --no-fund ../../../../kairos-io-design-*.tgz
          npm run build
      - name: Check the plain stylesheets the Go example embeds
        run: |
          mkdir -p /tmp/pkg && tar -xzf kairos-io-design-*.tgz -C /tmp/pkg
          test -s /tmp/pkg/package/tokens.css
          test -s /tmp/pkg/package/tailwind.css
          test -s /tmp/pkg/package/tokens.json
          test -s /tmp/pkg/package/dist/tokens.css
          test -s /tmp/pkg/package/dist/components.css
          test -s /tmp/pkg/package/dist/styles.css
          test -s /tmp/pkg/package/dist/index.js
