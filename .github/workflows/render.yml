name: Render check

# Free: GitHub-hosted runners. Public repos pay nothing; private repos draw on the org's free minutes
# (macOS counts 10x, Windows 2x), so this only runs on PRs, pushes to main and on demand.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
