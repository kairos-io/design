name: Release

# Publishes @kairos-io/design to the public npm registry when a version tag is pushed.
#
# It uses npm trusted publishing (OIDC). There is no NODE_AUTH_TOKEN and no stored secret.
# This only works after a maintainer has done two things by hand:
#   1. published the first version from a terminal (a trusted publisher can be set only
#      for a package that already exists on npm), and
#   2. added a trusted publisher on the package's npm settings page: organisation
#      kairos-io, repository design, workflow file release.yml.
# Until then the publish job fails at `npm publish`. That is expected.
#
# A run started by hand (workflow_dispatch) is a dry run. It builds, checks and packs, and
# never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check:tokens
      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/design/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match packages/design/package.json version $version" >&2
            exit 1
          fi
      - name: Show the package contents
        working-directory: packages/design
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: verify
    # A manual run can pick a tag as its ref, so check the event, not only the ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm version
        run: npm --version
      - name: Publish
        working-directory: packages/design
        run: npm publish --provenance --access public
