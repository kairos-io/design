<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="packages/design/tokens.css" rel="stylesheet">
<link href="assets/fonts/fonts.css" rel="stylesheet">
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink);-webkit-font-smoothing:antialiased}a{color:var(--ink);text-decoration:none}a:hover{color:var(--link)}*{box-sizing:border-box}</style>
</helmet>
<div style="max-width:1080px;margin:0 auto;padding:64px 32px 96px;display:flex;flex-direction:column;gap:36px">
  <div style="display:flex;flex-direction:column;gap:14px"><img src="assets/kairos-horizontal-light.svg" style="height:36px;width:max-content" alt="Kairos"><h1 style="margin:0;font-size:clamp(36px,5vw,56px);font-weight:600;letter-spacing:-.04em;line-height:1">Kairos design system</h1><p style="margin:0;font-size:18px;line-height:1.6;color:var(--sub);max-width:640px;text-wrap:pretty">Direction: Tessellate. Each screen has a light/dark theme tweak.</p></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px">
    <sc-for list="{{ files }}" as="f" hint-placeholder-count="6">
      <a href="{{ f.href }}" style="background:var(--surface);border-radius:var(--radius-base);padding:22px;display:flex;flex-direction:column;gap:8px" style-hover="background:var(--hover)">
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--link)">{{ f.n }}</span>
        <span style="font-size:22px;font-weight:700">{{ f.t }}</span>
        <span style="font-size:15px;line-height:1.5;color:var(--sub)">{{ f.d }}</span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { files: [
      ['01', 'Foundations', 'Logos, color, type, tiles, components and voice.', 'Kairos - Foundations.dc.html'],
      ['02', 'kairos.io', 'Homepage for Kairos.', 'kairos.io Homepage.dc.html'],
      ['03', 'Docs', 'Product page with L1/L2/L3 maturity tracks.', 'Kairos Docs - Product Page.dc.html'],
      ['04', 'Kairos Installer', 'On-node install UI at :8080.', 'Kairos Installer.dc.html'],
      ['05', 'Kairos console · Fleet › Nodes', 'Node list, rollout progress and node side panel.', 'Kairos Console - Nodes.dc.html'],
      ['05b', 'Kairos console · Fleet › Node detail', 'Health strip, live gauges for CPU, memory and temperature, disks, commands.', 'Kairos Console - Node Detail.dc.html'],
      ['05c', 'Kairos console · Factory › Build artifact', 'Six-step build wizard with live summary and equivalent CLI.', 'Kairos Console - Build Artifact.dc.html'],
      ['06', 'hadron-linux.io', 'Same system, Hadron blue.', 'hadron-linux.io Homepage.dc.html'],
      ['07', 'Naming', 'What stays a product, what became functionality, and what changed.', 'Kairos - Naming.dc.html'],
      ['08', 'Talk deck', 'Conference slide template: titles, dividers, light terminal, code, lifecycle, demo.', 'Kairos - Talk Deck.dc.html'],
      ['09', 'Presentations', 'How to present, export to PDF and make your own talk from the deck.', 'Kairos - Presentations.dc.html'],
      ['10', 'Storybook', 'The design package: tokens, React components and framework-free styles, with every screen above as a live example.', 'storybook/']
    ].map(([n, t, d, href]) => ({ n, t, d, href })) };
  }
}
</script>
</body>
</html>
